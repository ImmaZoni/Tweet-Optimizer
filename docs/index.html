<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tweet Optimizer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fab fa-twitter"></i>
            </div>
            <h1>Tweet Optimizer</h1>
            <p>Real-time tweet analysis based on Twitter's algorithm</p>
        </header>
        
        <main>
            <div class="card input-card">
                <div class="input-wrapper">
                    <textarea id="tweetInput" placeholder="What's happening?"></textarea>
                    <div class="character-count">
                        <span id="charCount">0</span>/280
                    </div>
                </div>
            </div>
            
            <div class="card results-card">
                <h2><i class="fas fa-chart-bar"></i> Analysis Results</h2>
                <div id="results">
                    <div class="empty-state">
                        <i class="far fa-edit"></i>
                        <p>Start typing to see real-time analysis</p>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Based on <a href="https://github.com/twitter/the-algorithm" target="_blank">Twitter's public algorithm</a>. 
            <span class="info-tooltip">
                <i class="fas fa-info-circle"></i>
                <span class="tooltip-text">This tool analyzes text-based signals only. It cannot account for all ranking factors.</span>
            </span>
            </p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
